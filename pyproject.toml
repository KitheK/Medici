[project]
name = "medici"
version = "0.0.1"
description = "Turn one job posting into a sourced outreach plan."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.17.6", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "privacy: privacy and safety tests that must always pass",
  "integration: runs real local components together (fixture site, sqlite, subprocesses)",
  "e2e: drives a whole workflow from its outer edge",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]