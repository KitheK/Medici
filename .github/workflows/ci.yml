name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make install
      - run: make ci
      - name: files_allowed diff check
        if: github.event_name == 'pull_request'
        run: python tools/check_files_allowed.py origin/${{ github.base_ref }}
